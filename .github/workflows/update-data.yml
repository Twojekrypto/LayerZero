name: Daily Full Holder Scan

on:
  schedule:
    # Run every hour at :30 (offset from hourly-monitor at :00/:15/:30/:45)
    - cron: '30 * * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: write

jobs:
  full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch holder data from Etherscan + Alchemy fallback
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ETHERSCAN_API_KEY_2: ${{ secrets.ETHERSCAN_API_KEY_2 }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python fetch_holders.py

      - name: Merge with existing data (preserve labels)
        run: python update_data.py

      - name: Refresh buybacks from Foundation tracker
        continue-on-error: true
        run: python fetch_buybacks.py

      - name: Auto-detect fresh wallets (<30 days old)
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ETHERSCAN_API_KEY_2: ${{ secrets.ETHERSCAN_API_KEY_2 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python detect_fresh.py

      - name: Backfill fresh wallet metadata
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ETHERSCAN_API_KEY_2: ${{ secrets.ETHERSCAN_API_KEY_2 }}
        run: python backfill_fresh.py

      - name: Restore flow cache
        uses: actions/cache@v4
        with:
          path: flow_cache.json
          key: flow-cache-v1
          restore-keys: flow-cache-

      - name: Generate real flow data from on-chain transfers
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ETHERSCAN_API_KEY_2: ${{ secrets.ETHERSCAN_API_KEY_2 }}
        run: python generate_flows.py

      - name: Restore label cache
        uses: actions/cache@v4
        with:
          path: label_cache.json
          key: label-cache-v1
          restore-keys: label-cache-

      - name: Auto-label top unlabeled wallets
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ETHERSCAN_API_KEY_2: ${{ secrets.ETHERSCAN_API_KEY_2 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python auto_label.py

      - name: Normalize dashboard snapshot
        run: python sanitize_zro_data.py --fail-on-anomaly

      - name: Verify normalized snapshot
        run: python verify_palace_rules.py

      - name: Run dashboard smoke tests
        run: npm test

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet zro_data.json holders_multichain.json scan_state.json fresh_cache.json 2>/dev/null && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zro_data.json holders_multichain.json scan_state.json fresh_cache.json label_cache.json
          git commit -m "📊 Daily holder scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin master
          git push
